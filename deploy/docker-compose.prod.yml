# Producción de Nectason en un servidor propio (Hetzner). La web sigue en Vercel.
# El HTTPS lo pone el proxy compartido del servidor (deploy/proxy).
#
#   cd /opt/nectason && docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Ver deploy/README.md.
name: nectason

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      ANALYZER_URL: http://analyzer:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      default: {}
      # Red compartida con el proxy (deploy/proxy): Caddy llega a la API por este alias.
      web:
        aliases: [nectason-api]

  analyzer:
    build: ../apps/analyzer
    restart: unless-stopped
    environment:
      ANALYZER_TOKEN: ${ANALYZER_TOKEN}
      ANALYZER_THREADS: ${ANALYZER_THREADS:-2}
    # Separar instrumentos (Demucs) usa toda la CPU que encuentre: se limita para
    # que la API (y otros proyectos del servidor, como la tienda) sigan ágiles.
    cpus: ${ANALYZER_CPUS:-1.5}
    # Sin puertos publicados: solo la API le habla, por la red interna.

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

networks:
  web:
    external: true

volumes:
  pgdata:
  redisdata:
